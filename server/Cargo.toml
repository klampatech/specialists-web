[package]
name = "specialists-server"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "specialists_server"
path = "src/lib.rs"

[[bin]]
name = "specialists-server"
path = "src/main.rs"

[dependencies]
# Async runtime — single Tokio binary.
tokio = { version = "1", features = ["full"] }
# PR 11.7.B / §3.1 — server-authoritative physics. The
# `enhanced-determinism` feature flag is load-bearing (see plan
# §5.2 hard-question 1): it disables Rapier's non-deterministic
# math ordering + parallel-island updates, so the same input
# sequence yields the same physics evolution across runs (the
# determinism contract §2.4 requires this for damage's
# `PositionHistory` rewind math to be correct).
#
# PR 11.7.B brief locked Rapier 0.12 ("DON'T bump Rapier version
# beyond 0.12 unless something in the integration breaks"). Rapier
# 0.12.0 has 112 compile errors on stable Rust 1.95 (E0223
# ambiguous-associated-type from query_pipeline.rs). Bumping to
# 0.18.0 (same dim3 + enhanced-determinism feature surface; same
# `rapier3d::prelude::*` import path) is the documented escape
# hatch. Feature set kept identical: dim3 (3D physics, not 2D),
# enhanced-determinism (deterministic math), f32 (the rapier
# f32/f64 split requires explicit selection in 0.13+; 0.12 was
# f32-by-default).
rapier3d = { version = "0.18", default-features = false, features = ["dim3", "f32", "enhanced-determinism"] }
# WebTransport primary transport (HTTP/3 + QUIC). Vendored locally — see
# `vendor/wtransport/PATCHES.md` for the one-line patch that works
# around the quinn 0.11.9+ `.0` privacy regression. Drop the vendor after
# PR 11.7 once a compatible current release is verified; keeping it here
# keeps the dev canary reproducible in the meantime.
wtransport = { path = "vendor/wtransport", default-features = false, features = ["self-signed"] }
# WebSocket fallback transport (plain `ws://`, dev/CI).
tokio-tungstenite = "0.24"
# PR 11.6.E / Session 2 — TLS-wrapped WebSocket fallback transport
# (`wss://`, production / Tailscale Funnel). When the page is loaded
# over HTTPS and the browser falls back from WebTransport to WebSocket,
# browsers mixed-content-block plain `ws://` URLs — the WSS listener
# terminates TLS on the same cert as the WebTransport listener, so the
# fallback path works cleanly on HTTPS pages.
#
# `tokio-rustls` 0.26 matches `rustls` 0.23 (already in the dep tree
# via `wtransport`). `rustls-pemfile` reads the PEM cert + key files
# we already produce for the WT listener. Reusing the same identity
# means a single cert/keystore is shared between WT and WSS.
#
# `tokio-rustls` defaults to `aws_lc_rs` as the crypto provider, but
# `wtransport` uses `ring`. To avoid the rustls-0.23 "could not
# automatically determine crypto provider" panic, we explicitly
# default-disable `aws_lc_rs` and let `rustls`'s `ring` feature
# (also enabled) be the provider — same as `wtransport`.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
# PR 11.6.E / Session 2 — direct rustls dep for building the
# ServerConfig in `build_wss_tls_acceptor`. `rustls` is already in
# the dep tree via `wtransport` (transitive), but we declare it
# directly so the WSS code path uses the canonical API instead of
# reaching through wtransport's re-export.
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "ring"] }
# Byte buffer helpers (BufMut for the wire encoders, Bytes for IO).
bytes = "1"
# Error helpers + glue.
anyhow = "1"
thiserror = "1"
# Structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Used by `transport::sans_with_defaults` for the merged SAN list.
futures = "0.3"
# Pure Rust vector math for the server-side lag-comp hit test. This is a
# direct dependency (rather than relying on a transitive wtransport version)
# so the hitscan API is stable if the transport implementation changes.
glam = "0.27"
# PR 11.9 — matchmaker room-ID minting. `rand::thread_rng()` gives
# cryptographic-quality randomness; we only need 8 chars from a
# 64-char alphabet (48 bits of entropy) per ID. The whole `rand`
# crate is small (~150KB) and pulls in no extras.
rand = "0.8"

[dev-dependencies]
# Re-declared under dev-dependencies so the integration smoke in
# `server/tests/session_canary.rs` can drive a WebTransport client AND a
# WebSocket client against the running server without leaking transport
# types into the library API.
tokio-tungstenite = "0.24"
wtransport = { path = "vendor/wtransport", default-features = false, features = ["self-signed", "dangerous-configuration"] }
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
