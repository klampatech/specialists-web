name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-typecheck:
    name: client — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Phase 0 / PR 2: headless smoke test of the Babylon scene.
  # Boots `npm run dev`, waits for the ready banner to disappear, captures a
  # screenshot, fails on any console error, and uploads the screenshot as a
  # build artifact so it's visible on the PR page.
  #
  # Why a separate job: `npm run dev` is a long-lived process, and the
  # typecheck + build job runs much faster. Splitting avoids serializing the
  # whole pipeline on the screenshot step.
  client-scene-smoke:
    name: client — scene smoke (headless screenshot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Boot dev server
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > /tmp/vite-dev.log 2>&1 &
          echo $! > /tmp/vite-dev.pid
          # Wait for the dev server to come up (max 60s)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "Dev server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5173/ > /dev/null; then
            echo "::error::Dev server did not come up in 60s"
            cat /tmp/vite-dev.log
            exit 1
          fi
      - name: Run headless smoke
        run: node ./tools/scene-smoke.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-screenshot
          path: client/scene-smoke.png
          if-no-files-found: warn
      - name: Upload walked screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-screenshot-walked
          path: client/scene-smoke-walked.png
          if-no-files-found: warn
      - name: Tear down dev server
        if: always()
        run: |
          if [[ -f /tmp/vite-dev.pid ]]; then
            kill "$(cat /tmp/vite-dev.pid)" || true
          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 4: headless two-tab WebRTC handshake smoke.
  # Boots a SECOND vite dev-server on port 5174 (so this job can run in
  # parallel with `client-scene-smoke` on 5173 without colliding), opens two
  # headless pages on the same browser context, drives the manual SDP/ICE
  # copy-paste flow, asserts both pages reach the "Connected" state, and
  # uploads both screenshots as artifacts.
  #
  # TURN relay: the smoke passes `?turn=force` to both tabs so the peer
  # uses openrelay.metered.ca TURN servers. STUN-only may fail in GH
  # sandboxed runners; TURN works because it routes via a public relay.
  client-two-tab-smoke:
    name: client — two-tab smoke (WebRTC handshake)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Boot second dev server (port 5174)
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5174 > /tmp/vite-dev2.log 2>&1 &
          echo $! > /tmp/vite-dev2.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5174/ > /dev/null; then
              echo "Dev server 2 ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5174/ > /dev/null; then
            echo "::error::Dev server 2 did not come up in 60s"
            cat /tmp/vite-dev2.log
            exit 1
          fi
      - name: Run two-tab smoke
        run: node ./tools/two-tab-smoke.mjs
        env:
          URL: http://localhost:5174/
          CONNECT_TIMEOUT_MS: 60000
      - name: Upload screenshot (tab A — host)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-tab-screenshot
          path: client/two-tab-smoke.png
          if-no-files-found: warn
      - name: Upload screenshot (tab B — guest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-tab-screenshot-connected
          path: client/two-tab-smoke-connected.png
          if-no-files-found: warn
      - name: Tear down dev server 2
        if: always()
        run: |
          if [[ -f /tmp/vite-dev2.pid ]]; then
            kill "$(cat /tmp/vite-dev2.pid)" || true
          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 8: jump regression smoke. Asserts that holding Space
  # produces ONE jump (peak Y above initial) and returns the character
  # to ground within 2s — i.e., the "fly up forever" bug observed during
  # the dev-box playtest is caught before merge.
  #
  # Why a separate job: this PR's fix (gravity accumulation in the
  # controller's update) is small and easy to accidentally regress in a
  # future PR. The smoke is the regression guard. It can run on a
  # dedicated port so the scene-smoke and two-tab-smoke jobs stay
  # unaffected.
  client-jump-smoke:
    name: client — jump regression smoke (PR 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Boot dev server (port 5175)
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5175 > /tmp/vite-dev3.log 2>&1 &
          echo $! > /tmp/vite-dev3.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5175/ > /dev/null; then
              echo "Dev server (jump smoke) ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5175/ > /dev/null; then
            echo "::error::Dev server (jump smoke) did not come up in 60s"
            cat /tmp/vite-dev3.log
            exit 1
          fi
      - name: Run jump regression smoke
        run: node ./tools/jump-regression-smoke.mjs
        env:
          JUMP_SMOKE_URL: http://localhost:5175/
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jump-regression-screenshot
          path: client/jump-regression.png
          if-no-files-found: warn
      - name: Tear down dev server
        if: always()
        run: |
          if [[ -f /tmp/vite-dev3.pid ]]; then
            kill "$(cat /tmp/vite-dev3.pid)" || true
          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 8.1: wallrun regression smoke. Asserts that holding Q
  # in mid-air does NOT make the character fly up indefinitely. The
  # underlying bug: if wallrunPressed is true at any frame after the
  # 1000ms wallrun timer expires, the controller re-enters wallrun,
  # resetting the timer — creating an indefinite upward cycle when
  # real-browser auto-repeat fires keydowns faster than the wallrun
  # duration. The fix: rising-edge detection + post-wallrun cooldown.
  #
  # Why a separate job: this is the second of two regression guards
  # for the controller's update() path. The single-keydown case is
  # what this smoke verifies (the smoke also passes pre-fix because
  # Playwright doesn't auto-repeat — the aggressive auto-repeat test
  # in tools/aggressive-wallrun.mjs is the actual diagnostic, removed
  # before commit). Run on port 5176 so it stays independent of the
  # other smoke jobs.
  client-wallrun-smoke:
    name: client — wallrun regression smoke (PR 8.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Boot dev server (port 5176)
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5176 > /tmp/vite-dev4.log 2>&1 &
          echo $! > /tmp/vite-dev4.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5176/ > /dev/null; then
              echo "Dev server (wallrun smoke) ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5176/ > /dev/null; then
            echo "::error::Dev server (wallrun smoke) did not come up in 60s"
            cat /tmp/vite-dev4.log
            exit 1
          fi
      - name: Run wallrun regression smoke
        run: node ./tools/wallrun-regression-smoke.mjs
        env:
          WALLRUN_SMOKE_URL: http://localhost:5176/
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallrun-regression-screenshot
          path: client/wallrun-regression.png
          if-no-files-found: warn
      - name: Tear down dev server
        if: always()
        run: |
          if [[ -f /tmp/vite-dev4.pid ]]; then
            kill "$(cat /tmp/vite-dev4.pid)" || true
          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 10: health regression smoke. Asserts that the new
  # HP pool actually drains to 0 under sustained LMB fire, that the
  # respawn timer fires after HEALTH.respawnDelayMs (1s + slack), and
  # that the controller teleports back to SPAWN_POSITION. Uses a
  # DEV-only `window.__teleportRemote(x, z)` accessor (gated behind
  # `import.meta.env.DEV`) so every shot in the smoke is a guaranteed
  # hit without depending on the visual position of the two rigs.
  #
  # Why a separate job: this PR introduces real HP mutation + the
  # respawn path. Both are easy to silently regress in a future PR
  # that touches CharacterController or GameSession. The smoke is the
  # regression guard. Port 5177 so it stays independent of all the
  # other smoke jobs (5173 / 5174 / 5175 / 5176).
  client-health-smoke:
    name: client — health regression smoke (PR 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Boot dev server (port 5177)
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5177 > /tmp/vite-dev5.log 2>&1 &
          echo $! > /tmp/vite-dev5.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5177/ > /dev/null; then
              echo "Dev server (health smoke) ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5177/ > /dev/null; then
            echo "::error::Dev server (health smoke) did not come up in 60s"
            cat /tmp/vite-dev5.log
            exit 1
          fi
      - name: Run health regression smoke
        run: node ./tools/health-regression-smoke.mjs
        env:
          HEALTH_SMOKE_URL: http://localhost:5177/
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-regression-screenshot
          path: client/health-regression.png
          if-no-files-found: warn
      - name: Tear down dev server
        if: always()
        run: |
          if [[ -f /tmp/vite-dev5.pid ]]; then
            kill "$(cat /tmp/vite-dev5.pid)" || true
          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 11.1: per-player first-person mouse-look smoke. Verifies
  # that the chase camera's yaw accumulator responds to yaw-delta updates
  # (the same code path the locked-mousemove listener uses). Headless
  # Chromium doesn't always honor requestPointerLock, so the smoke uses
  # the DEV-only `window.__applyYawDelta` accessor (scene.ts) to drive
  # the yaw directly — this exercises the wire-format change (yaw on
  # bytes 2-3 of INPUT_SIZE=10) AND the chase-camera yaw accumulator
  # without depending on the browser actually granting pointer-lock.
  # The full pointer-lock UX requires a dev-box two-tab playtest (which
  # Kyle does manually after the merge).
  #
  # Why a separate job: this is the regression guard for the
  # pointer-lock + mouse-look surface. The input-packet format change
  # (INPUT_SIZE 8→10, yaw on bytes 2-3) could silently regress in a
  # future PR that touches inputBitmask.ts. Port 5178 so it stays
  # independent of all the other smoke jobs (5173 / 5174 / 5175 /
  # 5176 / 5177).
  client-mouse-look-smoke:
    name: client — mouse-look smoke (PR 11.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Boot dev server (port 5178)
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5178 > /tmp/vite-dev6.log 2>&1 &
          echo $! > /tmp/vite-dev6.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5178/ > /dev/null; then
              echo "Dev server (mouse-look smoke) ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5178/ > /dev/null; then
            echo "::error::Dev server (mouse-look smoke) did not come up in 60s"
            cat /tmp/vite-dev6.log
            exit 1
          fi
      - name: Run mouse-look smoke
        run: node ./tools/mouse-look-smoke.mjs
        env:
          MOUSE_LOOK_SMOKE_URL: http://localhost:5178/
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mouse-look-screenshot
          path: client/mouse-look.png
          if-no-files-found: warn
      - name: Tear down dev server
        if: always()
        run: |
          if [[ -f /tmp/vite-dev6.pid ]]; then
            kill "$(cat /tmp/vite-dev6.pid)" || true
          fi
          pkill -f 'vite' || true

  spec-canonical:
    name: spec layout — canonical at docs/SPEC.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that docs/SPEC.md exists
        run: |
          if [[ ! -f docs/SPEC.md ]]; then
            echo "::error::docs/SPEC.md is missing — that is the canonical spec file."
            exit 1
          fi
      - name: Check that SPEC.md at the repo root is a stub pointer
        run: |
          if ! grep -q "docs/SPEC.md" SPEC.md; then
            echo "::error::SPEC.md (repo root) must be a stub pointer that references docs/SPEC.md."
            exit 1
          fi
          if ! grep -qE "Canonical source of truth: this file|canonical spec lives at .docs/SPEC.md" docs/SPEC.md; then
            echo "::error::docs/SPEC.md must declare itself as the canonical spec (e.g. 'Canonical source of truth: this file')."
            exit 1
          fi
      - name: Show the doc tree
        run: |
          echo "Spec files in this PR:"
          find . -name 'SPEC*' -type f -not -path './node_modules/*' -not -path './client/node_modules/*' | sort
