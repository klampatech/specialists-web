name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-typecheck:
    name: client — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Phase 0 / PR 2: headless smoke test of the Babylon scene.
  # Boots `npm run dev`, waits for the ready banner to disappear, captures a
  # screenshot, fails on any console error, and uploads the screenshot as a
  # build artifact so it's visible on the PR page.
  #
  # Why a separate job: `npm run dev` is a long-lived process, and the
  # typecheck + build job runs much faster. Splitting avoids serializing the
  # whole pipeline on the screenshot step.
  client-scene-smoke:
    name: client — scene smoke (headless screenshot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        # PR 11.4.1: cache the Playwright browser binary across runs.
        # ~/.cache/ms-playwright is the standard Playwright cache location.
        # The key is scoped by the Playwright version + OS so a version
        # bump picks up a fresh download automatically.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-
      - name: Install Playwright browser (chromium only — no --with-deps)
        # PR 11.4.1: --with-deps hangs on self-hosted runners without sudo
        # (apt install prompts for password). The system deps are already
        # installed on the runner (Chromium runs fine for all 14 smokes).
        # The Playwright cache below restores ~/.cache/ms-playwright/
        # between runs so we don't re-download the browser each time.
        run: npx playwright install chromium
        timeout-minutes: 3
      - name: Boot dev server
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > /tmp/vite-dev.log 2>&1 &
          echo $! > /tmp/vite-dev.pid
          # Wait for the dev server to come up (max 60s)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "Dev server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5173/ > /dev/null; then
            echo "::error::Dev server did not come up in 60s"
            cat /tmp/vite-dev.log
            exit 1
          fi
      - name: Run headless smoke
        run: node ./tools/scene-smoke.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-screenshot
          path: client/scene-smoke.png
          if-no-files-found: warn
      - name: Upload walked screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-screenshot-walked
          path: client/scene-smoke-walked.png
          if-no-files-found: warn
      - name: Tear down dev server
        if: always()
        run: |
          if [[ -f /tmp/vite-dev.pid ]]; then
            kill "$(cat /tmp/vite-dev.pid)" || true
          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 4: headless two-tab WebRTC handshake smoke.
  # Boots a SECOND vite dev-server on port 5174 (so this job can run in
  # parallel with `client-scene-smoke` on 5173 without colliding), opens two
  # headless pages on the same browser context, drives the manual SDP/ICE
  # copy-paste flow, asserts both pages reach the "Connected" state, and
  # uploads both screenshots as artifacts.
  #
  # TURN relay: the smoke passes `?turn=force` to both tabs so the peer
  # uses openrelay.metered.ca TURN servers. STUN-only may fail in GH
  # sandboxed runners; TURN works because it routes via a public relay.
  client-two-tab-smoke:
    name: client — two-tab smoke (WebRTC handshake)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        # PR 11.4.1: cache the Playwright browser binary across runs.
        # ~/.cache/ms-playwright is the standard Playwright cache location.
        # The key is scoped by the Playwright version + OS so a version
        # bump picks up a fresh download automatically.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-
      - name: Install Playwright browser (chromium only — no --with-deps)
        # PR 11.4.1: --with-deps hangs on self-hosted runners without sudo
        # (apt install prompts for password). The system deps are already
        # installed on the runner (Chromium runs fine for all 14 smokes).
        # The Playwright cache below restores ~/.cache/ms-playwright/
        # between runs so we don't re-download the browser each time.
        run: npx playwright install chromium
        timeout-minutes: 3
      - name: Boot second dev server (port 5174)
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5174 > /tmp/vite-dev2.log 2>&1 &
          echo $! > /tmp/vite-dev2.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5174/ > /dev/null; then
              echo "Dev server 2 ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5174/ > /dev/null; then
            echo "::error::Dev server 2 did not come up in 60s"
            cat /tmp/vite-dev2.log
            exit 1
          fi
      - name: Run two-tab smoke
        run: node ./tools/two-tab-smoke.mjs
        env:
          URL: http://localhost:5174/
          CONNECT_TIMEOUT_MS: 60000
      - name: Upload screenshot (tab A — host)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-tab-screenshot
          path: client/two-tab-smoke.png
          if-no-files-found: warn
      - name: Upload screenshot (tab B — guest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-tab-screenshot-connected
          path: client/two-tab-smoke-connected.png
          if-no-files-found: warn
      - name: Tear down dev server 2
        if: always()
        run: |
          if [[ -f /tmp/vite-dev2.pid ]]; then
            kill "$(cat /tmp/vite-dev2.pid)" || true
          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 8: jump regression smoke. Asserts that holding Space
  # produces ONE jump (peak Y above initial) and returns the character
  # to ground within 2s — i.e., the "fly up forever" bug observed during
  # the dev-box playtest is caught before merge.
  #
  # Why a separate job: this PR's fix (gravity accumulation in the
  # controller's update) is small and easy to accidentally regress in a
  # future PR. The smoke is the regression guard. It can run on a
  # dedicated port so the scene-smoke and two-tab-smoke jobs stay
  # unaffected.
  client-jump-smoke:
    name: client — jump regression smoke (PR 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
