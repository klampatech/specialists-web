        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-
      - name: Install Playwright browser (chromium only)
        run: npx playwright install chromium
        timeout-minutes: 3
      - name: Pre-build canary binary (avoid racing smoke's boot)
        run: |
          for port in 5174 14433 14434; do
            pids=$(lsof -ti:${port} 2>/dev/null || true)
            if [[ -n "$pids" ]]; then kill -9 $pids || true; fi
          done
          (cd ../server && cargo build --release --bin specialists-server)
        env:
          CARGO_TERM_COLOR: never
      - name: Run 24-player stress smoke
        # 5s snapshot settle (slow CI runners need the headroom) +
        # 5s stats-interval overlap so we see at least 2-3 [stress-stats]
        # lines in the canary log before the assertion runs.
        run: node ./tools/stress-24p-smoke.mjs
        env:
          STRESS_24P_N: "24"
          STRESS_24P_SNAPSHOT_SETTLE_MS: "5000"
          CANARY_STATS_INTERVAL_MS: "3000"
      - name: Tear down canary + Vite
        if: always()
        run: |
          pkill -f canary-server.sh || true
          pkill -f 'vite.*5174' || true
          for port in 5174 14433 14434; do
            pids=$(lsof -ti:${port} 2>/dev/null || true)
            if [[ -n "$pids" ]]; then kill -9 $pids || true; fi
          done
