  # that `encodeInput(s)` and `decodeInput(b)` round-trip pitch
  # correctly (encode → decode → same pitch, within 1.5 LSB
  # tolerance). This is the load-bearing regression guard for the
  # wire-format change (INPUT_SIZE 10 → 12, pitch on bytes 4-5
  # little-endian uint16). Tests 7 representative pitch values
  # (0, 0.3, -0.5, π/4, ±π/2, just-under-π/2) to cover the
  # clamp-arithmetic edge cases + a backward-compat assertion that
  # a packet with bytes 4-5 = 0 decodes as pitchRadians = 0 (level),
  # NOT -π/2 (the linear formula's would-be wrong default).
  #
  # Why a separate job: catches off-by-one errors in pitchToBits /
  # decodeInput's byte-shifting + the backward-compat shim. The
  # lockstep layer can't run this test in CI because headless
  # Chromium can't establish the ICE connection (TURN unreachable
  # from the GH runner); the wire-format itself is testable without
  # WebRTC. The runtime+WebRTC layer is verified by the existing
  # `client-two-tab-smoke` + manual dev-box playtests.
