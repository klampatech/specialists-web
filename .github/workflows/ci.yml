    name: client — mouse-pitch smoke (PR 11.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        # PR 11.4.1: cache the Playwright browser binary across runs.
        # ~/.cache/ms-playwright is the standard Playwright cache location.
        # The key is scoped by the Playwright version + OS so a version
        # bump picks up a fresh download automatically.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
