          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 11.1: per-player first-person mouse-look smoke. Verifies
  # that the chase camera's yaw accumulator responds to yaw-delta updates
  # (the same code path the locked-mousemove listener uses). Headless
  # Chromium doesn't always honor requestPointerLock, so the smoke uses
  # the DEV-only `window.__applyYawDelta` accessor (scene.ts) to drive
  # the yaw directly — this exercises the wire-format change (yaw on
  # bytes 2-3 of INPUT_SIZE=10) AND the chase-camera yaw accumulator
  # without depending on the browser actually granting pointer-lock.
  # The full pointer-lock UX requires a dev-box two-tab playtest (which
  # Kyle does manually after the merge).
  #
  # Why a separate job: this is the regression guard for the
  # pointer-lock + mouse-look surface. The input-packet format change
  # (INPUT_SIZE 8→10, yaw on bytes 2-3) could silently regress in a
  # future PR that touches inputBitmask.ts. Port 5178 so it stays
  # independent of all the other smoke jobs (5173 / 5174 / 5175 /
  # 5176 / 5177).
  client-mouse-look-smoke:
    name: client — mouse-look smoke (PR 11.1)
    runs-on: ubuntu-latest
