  # (encode → decode → same yaw mod 2π, within 1.5 LSB tolerance).
  # This is the load-bearing regression guard for the wire-format change
  # (INPUT_SIZE 8 → 10, yaw on bytes 2-3 little-endian uint16). Tests
  # 7 representative yaw values (0, 0.5, -0.3, π/2, -π, just-under-2π,
  # multi-wrap) to cover the wrap-arithmetic edge cases.
  #
  # Why a separate job: catches off-by-one errors in yawToBits /
  # decodeInput's byte-shifting. The lockstep layer can't run this
  # test in CI because headless Chromium can't establish the ICE
  # connection (TURN unreachable from the GH runner); the wire-format
  # itself is testable without WebRTC. The runtime+WebRTC layer is
  # verified by the existing `client-two-tab-smoke` + manual dev-box
  # playtests.
  #
  # Port 5182 so it stays independent of all the other smoke jobs.
  client-yaw-wire-format-smoke:
