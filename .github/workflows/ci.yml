name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client-typecheck:
    name: client — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  server-build:
    name: server — build + test (Rust, PR 11.6.B)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - name: Build (release)
        run: cargo build --release
      - name: Test
        run: cargo test
        env:
          # The WebTransport integration smoke in tests/session_canary.rs
          # is gated on this env var being unset. CI sets it because the
          # mTLS dance for self-signed certs is flaky in the sandboxed
          # GitHub runner. The dev box runs without it (see
          # tools/canary-server.sh).
          SKIP_WEBTRANSPORT_TEST: 1

  # Phase 1 / PR 11.6.C — server-transport round-trip smoke.
  # Boots the canary server (WebTransport + WebSocket) + Vite on port
  # 5190, opens a single headless tab with the `__forceServerTransport`
  # DEV probe set, and asserts the wire-format round-trip (ping/pong,
  # damage request → synthetic broadcast, position update → no reply,
  # inputs → no error, malformed payload → no crash, wire sizes). The
  # smoke port is independent of all other client smoke jobs.
  # PR 11.6.D fix5: client-vitest job — runs `npm test` in CI.
  # The 10 boundary tests (Tests A/B/C/D from fix3 + Test E for
  # actualDelta from fix4 + Tests F/G/H for the fix4 invariants
  # (clamped confirm convergence, drop-branch markSettled,
  # DamageReject round-trip)) verify the damageBus pending-map
  # invariants + the 0x07 DamageReject wire-type contract.
  # Without this job, the only CI coverage on those invariants was
  # the 5191 HP-convergence smoke — which is itself broken on the
  # 12-HP gap (fix6 work). So a future PR regressing actualDelta
  # would only be caught by the broken smoke. Adding the vitest
  # job gives an honest unit-level green signal in CI.
  client-vitest:
    name: client — vitest boundary tests (PR 11.6.D fix5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Run vitest
        run: npm test
  client-damage-server-smoke:
    name: client — damage server smoke (PR 11.6.C, port 5190)
    # PR 11.6.C review fix B4: serialize after server-build so cold
    # cargo work doesn't race between the two jobs (both write to
    # `server/target`, which on a cold cache can cause sporadic
    # `cargo: file lock` errors or stale-binary issues). The canary
    # binary in this job is the same one that passed server-build.
    needs: server-build
    runs-on: ubuntu-latest
    # No `defaults.run.working-directory` — cargo steps run from repo root
    # (so `cargo --manifest-path server/Cargo.toml` resolves correctly);
    # the npm + smoke steps run with explicit `working-directory: client`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - name: Build server (release)
        run: cargo build --release --manifest-path server/Cargo.toml
      - name: Test server (skip WebTransport integration)
        run: cargo test --manifest-path server/Cargo.toml
        env:
          SKIP_WEBTRANSPORT_TEST: 1
      - name: Install npm deps
        working-directory: client
        run: npm ci
      - name: Cache Playwright browsers
        # PR 11.4.1: cache the Playwright browser binary across runs.
        # The key is scoped by the Playwright version + OS so version
        # bumps pick up a fresh download automatically.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-
      - name: Install Playwright browser (chromium only — no --with-deps)
        # PR 11.4.1: --with-deps hangs on self-hosted runners without sudo.
        # The system deps are already installed on the runner.
        # The Playwright cache above restores ~/.cache/ms-playwright/
        # between runs so we don't re-download the browser each time.
        run: npx playwright install chromium
        timeout-minutes: 3
      - name: Boot canary server (ports 14433 + 14434)
        run: |
          nohup bash tools/canary-server.sh --port-wt 14433 --port-ws 14434             > /tmp/canary-server.log 2>&1 &
          echo $! > /tmp/canary-server.pid
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/14434) >/dev/null 2>&1; then
              echo "Canary server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! (echo > /dev/tcp/127.0.0.1/14434) >/dev/null 2>&1; then
            echo "::error::Canary server did not become ready in 60s"
            cat /tmp/canary-server.log
            exit 1
          fi
      - name: Boot Vite dev server (port 5190)
        working-directory: client
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5190 --strictPort             > /tmp/vite-5190.log 2>&1 &
          echo $! > /tmp/vite-5190.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5190/ > /dev/null; then
              echo "Vite (damage server smoke) ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5190/ > /dev/null; then
            echo "::error::Vite (damage server smoke) did not become ready in 60s"
            cat /tmp/vite-5190.log
            exit 1
          fi
      - name: Run damage server smoke
        working-directory: client
        run: node tools/damage-server-smoke.mjs
        env:
          DAMAGE_SERVER_SMOKE_URL: http://localhost:5190/
          CANARY_SERVER_PORT_WT: 14433
          CANARY_SERVER_PORT_WS: 14434
          SMOKE_PNG: client/tools/damage-server-smoke.png
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-server-smoke-screenshot
          path: client/tools/damage-server-smoke.png
          if-no-files-found: warn
      - name: Tear down canary + Vite
        if: always()
        run: |
          if [[ -f /tmp/canary-server.pid ]]; then kill "$(cat /tmp/canary-server.pid)" || true; fi
          if [[ -f /tmp/vite-5190.pid ]]; then kill "$(cat /tmp/vite-5190.pid)" || true; fi
          # Belt-and-suspenders: kill any stragglers on the known ports.
          pkill -f canary-server.sh || true
          pkill -f 'vite.*5190' || true
          for port in 5190 14433 14434; do
            pids=$(lsof -ti:${port} 2>/dev/null || true)
            if [[ -n "$pids" ]]; then kill -9 $pids || true; fi
          done

  # PR 11.6.D — two-tab HP-convergence smoke (server-auth damage end-to-end).
  # Boots TWO headless browser contexts against the SAME canary-server
  # room, drives 1 fire from Tab A, asserts both tabs converge on the
  # same HP. Verifies the §3.4 / §3.9 implementation:
  #   - server-side validate_and_relay (8 gates + lag-comp rewind)
  #   - client-side optimistic apply + broadcast confirm
  #   - 120ms fire-rate cooldown
  #   - DamageBroadcast fan-out to all room connections
  # The job mirrors `client-damage-server-smoke` (PR 11.6.C) but uses
  # port 5191 + the new `damage-server-hp-convergence-smoke.mjs`.
  # CRITICAL: per-step `working-directory: client` (NOT job-level —
  # the GH Actions job-level `working-directory` trap that bit
  # PR 11.6.C; cargo resolves manifest from CWD, vite resolves smoke
  # script paths from CWD).
  client-damage-server-hp-convergence-smoke:
    name: client — damage server HP-convergence smoke (PR 11.6.D, port 5191)
    needs: server-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - name: Build server (release)
        run: cargo build --release --manifest-path server/Cargo.toml
      - name: Test server (skip WebTransport integration)
        run: cargo test --manifest-path server/Cargo.toml
        env:
          SKIP_WEBTRANSPORT_TEST: 1
      - name: Install npm deps
        working-directory: client
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-
      - name: Install Playwright browser (chromium only)
        run: npx playwright install chromium
        timeout-minutes: 3
      - name: Boot canary server (ports 14433 + 14434)
        run: |
          nohup bash tools/canary-server.sh --port-wt 14433 --port-ws 14434             > /tmp/canary-server-hp.log 2>&1 &
          echo $! > /tmp/canary-server-hp.pid
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/14434) >/dev/null 2>&1; then
              echo "Canary server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! (echo > /dev/tcp/127.0.0.1/14434) >/dev/null 2>&1; then
            echo "::error::Canary server did not become ready in 60s"
            cat /tmp/canary-server-hp.log
            exit 1
          fi
      - name: Boot Vite dev server (port 5191)
        working-directory: client
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5191 --strictPort             > /tmp/vite-5191.log 2>&1 &
          echo $! > /tmp/vite-5191.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5191/ > /dev/null; then
              echo "Vite (HP-convergence smoke) ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5191/ > /dev/null; then
            echo "::error::Vite (HP-convergence smoke) did not become ready in 60s"
            cat /tmp/vite-5191.log
            exit 1
          fi
      - name: Run damage server HP-convergence smoke
        working-directory: client
        run: node tools/damage-server-hp-convergence-smoke.mjs
        env:
          HP_CONV_SMOKE_URL: http://localhost:5191/
          HP_CONV_WT_PORT: 14433
          HP_CONV_WS_PORT: 14434
          SMOKE_PNG: client/tools/damage-server-hp-convergence-smoke.png
          # PR 11.6.D FIX 9: the canary + Vite are already booted
          # by the steps above; the smoke just connects to them.
          SMOKE_NO_BOOT: "1"
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: damage-server-hp-convergence-smoke-screenshot
          path: client/tools/damage-server-hp-convergence-smoke.png
          if-no-files-found: warn
      - name: Tear down canary + Vite
        if: always()
        run: |
          if [[ -f /tmp/canary-server-hp.pid ]]; then kill "$(cat /tmp/canary-server-hp.pid)" || true; fi
          if [[ -f /tmp/vite-5191.pid ]]; then kill "$(cat /tmp/vite-5191.pid)" || true; fi
          # Belt-and-suspenders: kill any stragglers on the known ports.
          pkill -f canary-server.sh || true
          pkill -f 'vite.*5191' || true
          for port in 5191 14433 14434; do
            pids=$(lsof -ti:${port} 2>/dev/null || true)
            if [[ -n "$pids" ]]; then kill -9 $pids || true; fi
          done

  # Phase 0 / PR 2: headless smoke test of the Babylon scene.
  # Boots `npm run dev`, waits for the ready banner to disappear, captures a
  # screenshot, fails on any console error, and uploads the screenshot as a
  # build artifact so it's visible on the PR page.
  #
  # Why a separate job: `npm run dev` is a long-lived process, and the
  # typecheck + build job runs much faster. Splitting avoids serializing the
  # whole pipeline on the screenshot step.
  client-scene-smoke:
    name: client — scene smoke (headless screenshot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        # PR 11.4.1: cache the Playwright browser binary across runs.
        # ~/.cache/ms-playwright is the standard Playwright cache location.
        # The key is scoped by the Playwright version + OS so a version
        # bump picks up a fresh download automatically.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-
      - name: Install Playwright browser (chromium only — no --with-deps)
        # PR 11.4.1: --with-deps hangs on self-hosted runners without sudo
        # (apt install prompts for password). The system deps are already
        # installed on the runner (Chromium runs fine for all 14 smokes).
        # The Playwright cache below restores ~/.cache/ms-playwright/
        # between runs so we don't re-download the browser each time.
        run: npx playwright install chromium
        timeout-minutes: 3
      - name: Boot dev server
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5173 > /tmp/vite-dev.log 2>&1 &
          echo $! > /tmp/vite-dev.pid
          # Wait for the dev server to come up (max 60s)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "Dev server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5173/ > /dev/null; then
            echo "::error::Dev server did not come up in 60s"
            cat /tmp/vite-dev.log
            exit 1
          fi
      - name: Run headless smoke
        run: node ./tools/scene-smoke.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-screenshot
          path: client/scene-smoke.png
          if-no-files-found: warn
      - name: Upload walked screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-screenshot-walked
          path: client/scene-smoke-walked.png
          if-no-files-found: warn
      - name: Tear down dev server
        if: always()
        run: |
          if [[ -f /tmp/vite-dev.pid ]]; then
            kill "$(cat /tmp/vite-dev.pid)" || true
          fi
          pkill -f 'vite' || true


  # PR 11.7.D2 / §3.10 — two-tab ServerTransport smoke (REWRITTEN post-D2.2).
  # Boots the canary server (WT=14433 + WS=14434) + Vite on port 5174,
  # opens TWO headless browser contexts (each with its own
  # `?server=` URL param + `__forceServerTransport = true` init script)
  # connected to the SAME room (DEVBX). Asserts both
  # ServerTransport.connect() resolve within 5s, then both tabs'
  # __latestSnap() match after a 500ms settle (server-authoritative
  # Snapshot fan-out). Replaces the pre-D2.2 WebRTC clipboard handshake
  # smoke (P2P substrate retired in squash 36e475a).
  client-two-tab-smoke:
    name: client — two-tab smoke (ServerTransport, PR 11.7.D2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        # PR 11.4.1: cache the Playwright browser binary across runs.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-
      - name: Install Playwright browser (chromium only — no --with-deps)
        run: npx playwright install chromium
        timeout-minutes: 3
      # PR 11.7.D2.1 / fix: pre-build the server (matches the pattern
      # in client-damage-server-hp-convergence-smoke / PR 11.6.D).
      # Without this step the canary-server.sh's built-in cargo build
      # takes longer than the 60s wait-for-ready loop, so the loop
      # times out before the server binds 14433/14434. The pre-build
      # uses the rust cache so subsequent runs are <5s.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - name: Build server (release)
        # PR 11.7.D2.1 / fix: explicit working-directory: . (repo
        # root) overrides the job-level default of `client`. The
        # `cargo build --manifest-path server/Cargo.toml` command
        # needs to find server/Cargo.toml from the repo root, not
        # from client/ (where it would try client/server/Cargo.toml).
        working-directory: .
        run: cargo build --release --manifest-path server/Cargo.toml
      - name: Boot canary server (ports 14433 + 14434)
        run: |
          # PR 11.7.D2.1 / fix: relative path `../tools/canary-server.sh`
          # because this job has `defaults: working-directory: client`
          # at the job level (inherited from the pre-D2.2 WebRTC two-tab
          # smoke). Without the `../`, `tools/canary-server.sh` resolves
          # to `client/tools/canary-server.sh` which doesn't exist
          # (the script lives at REPO_ROOT/tools/canary-server.sh).
          nohup bash ../tools/canary-server.sh --port-wt 14433 --port-ws 14434 > /tmp/canary-server-two-tab.log 2>&1 &
          echo $! > /tmp/canary-server-two-tab.pid
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/14434) >/dev/null 2>&1; then
              echo "Canary server (two-tab smoke) ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! (echo > /dev/tcp/127.0.0.1/14434) >/dev/null 2>&1; then
            echo "::error::Canary server (two-tab smoke) did not become ready in 60s"
            cat /tmp/canary-server-two-tab.log
            exit 1
          fi
      - name: Boot second dev server (port 5174)
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/vite-dev2.log 2>&1 &
          echo $! > /tmp/vite-dev2.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5174/ > /dev/null; then
              echo "Dev server 2 ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:5174/ > /dev/null; then
            echo "::error::Dev server 2 did not come up in 60s"
            cat /tmp/vite-dev2.log
            exit 1
          fi
      - name: Run two-tab smoke
        run: node ./tools/two-tab-smoke.mjs
        env:
          URL: http://localhost:5174/
          SMOKE_NO_BOOT: "1"
      - name: Upload screenshot (tab A — host)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-tab-screenshot
          path: client/tools/two-tab-smoke.png
          if-no-files-found: warn
      - name: Upload screenshot (tab B — guest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-tab-screenshot-connected
          path: client/tools/two-tab-smoke-connected.png
          if-no-files-found: warn
  client-two-tab-manual-flow-smoke:
    # PR 11.7.D2.1 — manual-flow smoke. Replicates the exact
    # Kyle-uses-Tailscale 2-tab manual test as an automated
    # Playwright check. Distinct from the 2-tab smoke above in that
    # it asserts the user-visible rig positions + cross-tab walk
    # mirroring, not just server-authoritative damage routing.
    # Asserts:
    #   1. Snapshot integrity ([1, 2] only, no ghost connections).
    #   2. Rigs separated by player-id-derived spawn (no overlap).
    #   3. Both rig meshes enabled in both tabs.
    #   4. Tab A walks forward → Tab B's remote rig mirrors the walk.
    #   5. HP cross-tab converges after firing from Tab A.
    # See client/tools/two-tab-manual-flow.mjs for the full assertion list.
    # NOTE: this smoke is a manual-flow REPLICA, not part of the
    # automated PR gate yet. CI's slow dev-cert generation (~75s)
    # races the smoke's canary-wait timeout, making this job flaky
    # on a cold runner. Kyle runs it manually via
    # `node client/tools/two-tab-manual-flow.mjs` against his local
    # canary+vite to validate cross-tab visible behavior. Once we
    # wire canary-server.sh to skip cert generation when a
    # pre-baked cert exists in CI's cache, this flips to a required
    # gate. (CI FAIL is expected on the first few runs as we
    # stabilize the boot ordering.)
    name: client — two-tab manual-flow smoke (replicates user manual test, PR 11.7.D2.1, opt-in)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-chromium-
      - name: Install Playwright browser (chromium only)
        run: npx playwright install chromium
        timeout-minutes: 3
      - name: Pre-build canary binary (avoid racing smoke's boot)
        run: |
          # Belt-and-suspenders: kill any stragglers from previous
          # jobs that left canary/vite on the expected ports.
          for port in 5174 14433 14434; do
            pids=$(lsof -ti:${port} 2>/dev/null || true)
            if [[ -n "$pids" ]]; then kill -9 $pids || true; fi
          done
          # PR 11.6.B server is a release-mode cargo binary; build it
          # FIRST so the smoke doesn't have to wait for compile +
          # cert generation at smoke time. CI's cold dev-cert
          # generation alone takes ~75-85s; building the binary
          # first lets the smoke's own canary boot immediately on
          # top. Note: this job's defaults.run.working-directory is
          # `client/`, so we cd up one level to find the repo root.
          (cd ../server && cargo build --release --bin specialists-server)
        env:
          CARGO_TERM_COLOR: never
      - name: Run two-tab manual-flow smoke
        run: node ./tools/two-tab-manual-flow.mjs
        env:
          TWO_TAB_FLOW_BOOT: "1"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-tab-manual-flow-screenshots
          path: client/tools/two-tab-manual-flow
          if-no-files-found: warn
      - name: Tear down canary + Vite
        if: always()
        run: |
          pkill -f canary-server.sh || true
          pkill -f 'vite.*5174' || true
          for port in 5174 14433 14434; do
            pids=$(lsof -ti:${port} 2>/dev/null || true)
            if [[ -n "$pids" ]]; then kill -9 $pids || true; fi
          done
  # PR 11.7.D3.3 — 24-player stress smoke. Pushes the room to
  # MAX_PLAYERS_PER_ROOM = 24 (server/src/constants.rs) and verifies
  # the snapshot fan-out reaches all 24 tabs without saturating the
  # per-connection outbound queue (drop-oldest counter stays at 0).
