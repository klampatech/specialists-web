        # between runs so we don't re-download the browser each time.
        run: npx playwright install chromium
        timeout-minutes: 3
      - name: Boot dev server (port 5178)
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5178 > /tmp/vite-dev6.log 2>&1 &
          echo $! > /tmp/vite-dev6.pid
          for i in $(seq 1 60); do
