      - name: Tear down dev server
        if: always()
        run: |
          if [[ -f /tmp/vite-dev4.pid ]]; then
            kill "$(cat /tmp/vite-dev4.pid)" || true
          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 10: health regression smoke. Asserts that the new
  # HP pool actually drains to 0 under sustained LMB fire, that the
  # respawn timer fires after HEALTH.respawnDelayMs (1s + slack), and
  # that the controller teleports back to SPAWN_POSITION. Uses a
  # DEV-only `window.__teleportRemote(x, z)` accessor (gated behind
  # `import.meta.env.DEV`) so every shot in the smoke is a guaranteed
  # hit without depending on the visual position of the two rigs.
  #
  # Why a separate job: this PR introduces real HP mutation + the
  # respawn path. Both are easy to silently regress in a future PR
  # that touches CharacterController or GameSession. The smoke is the
  # regression guard. Port 5177 so it stays independent of all the
  # other smoke jobs (5173 / 5174 / 5175 / 5176).
  client-health-smoke:
