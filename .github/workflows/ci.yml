          fi
          pkill -f 'vite' || true

  # Phase 0 / PR 8.1: wallrun regression smoke. Asserts that holding Q
  # in mid-air does NOT make the character fly up indefinitely. The
  # underlying bug: if wallrunPressed is true at any frame after the
  # 1000ms wallrun timer expires, the controller re-enters wallrun,
  # resetting the timer — creating an indefinite upward cycle when
  # real-browser auto-repeat fires keydowns faster than the wallrun
  # duration. The fix: rising-edge detection + post-wallrun cooldown.
  #
  # Why a separate job: this is the second of two regression guards
  # for the controller's update() path. The single-keydown case is
  # what this smoke verifies (the smoke also passes pre-fix because
  # Playwright doesn't auto-repeat — the aggressive auto-repeat test
  # in tools/aggressive-wallrun.mjs is the actual diagnostic, removed
  # before commit). Run on port 5176 so it stays independent of the
  # other smoke jobs.
  client-wallrun-smoke:
