  # Phase 0 / PR 11.3: per-player mouse-pitch smoke. Verifies that
  # the chase camera's pitch accumulator responds to pitch-delta
  # updates (the same code path the locked-mousemove listener uses
  # when dispatching on `e.movementY * sensitivity`). Headless
  # Chromium doesn't always honor requestPointerLock, so the smoke
  # uses the DEV-only `window.__applyPitchDelta` accessor (scene.ts)
  # to drive the pitch directly — this exercises the wire-format
  # change (pitch on bytes 4-5 of INPUT_SIZE=12) AND the chase-
  # camera pitch accumulator WITHOUT depending on the browser
  # actually granting pointer-lock. The full pointer-lock UX
  # requires a dev-box two-tab playtest (Kyle does manually after
  # the merge).
  #
  # The smoke asserts the regression guard for the wrap-vs-clamp
  # gotcha: applyPitchDelta CLAMPS pitch to [±π/2], not WRAPS. Trying
  # to push past the limit should hold at ±π/2 (not flip the view).
